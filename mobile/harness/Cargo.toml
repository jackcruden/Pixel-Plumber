[package]
name = "harness"
version = "0.1.0"
edition = "2021"

[dependencies]
sim = { path = "../sim" }
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
serde = { version = "1", features = ["derive"] }
ron = "0.8"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "budgets"
harness = false
